# Nginx config for the VPS host.
# Place at /etc/nginx/sites-available/tunnelx.conf and symlink to sites-enabled.
#
# Prerequisites on the VPS:
#   1. Run infra/scripts/certbot-wildcard.sh to obtain a wildcard TLS cert for
#      yourdomain.dev and *.yourdomain.dev.
#   2. Replace EVERY occurrence of "yourdomain.dev" below with your real domain.
#   3. docker compose -f infra/docker-compose.prod.yml up -d  (gateway :4000, dashboard :5000)
#
# Architecture:
#   *.yourdomain.dev  → gateway:4000  (tunnel HTTP traffic)
#   app.yourdomain.dev/api/  → gateway:4000  (REST API + WS)
#   app.yourdomain.dev/      → dashboard:5000 (React SPA)

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.dev *.yourdomain.dev;
    return 301 https://$host$request_uri;
}

# ── Wildcard: tunnel traffic (*.yourdomain.dev) ───────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name *.yourdomain.dev;

    ssl_certificate     /etc/letsencrypt/live/yourdomain.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.dev/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Disable response buffering so streamed bodies flow through immediately.
    proxy_buffering off;

    location / {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # Forward the original Host header so the gateway can look up the subdomain.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket passthrough (tunnel client connections at /ws/tunnel).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 86400s;
    }
}

# ── App: dashboard + API (app.yourdomain.dev) ─────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.yourdomain.dev;

    ssl_certificate     /etc/letsencrypt/live/yourdomain.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.dev/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Gateway: REST API + dashboard WS (/api/ws/dashboard).
    location /api/ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 86400s;
    }

    # Gateway: tunnel client WebSocket (/ws/tunnel).
    # CLI connects to wss://app.yourdomain.dev/ws/tunnel if you prefer
    # one hostname, or to wss://gateway.yourdomain.dev/ws/tunnel (wildcard block).
    location /ws/ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 86400s;
    }

    # Dashboard static files (React SPA).
    location / {
        proxy_pass       http://127.0.0.1:5000;
        proxy_set_header Host $host;
    }
}
