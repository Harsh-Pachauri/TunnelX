# nginx config for the dashboard container (SPA static file server).
# This runs inside the dashboard Docker image — NOT on the VPS host.
# The VPS host Nginx (tunnelx.conf) proxies app.yourdomain.dev here.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed JS/CSS bundles — cache aggressively.
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Other static assets — moderate cache.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # SPA fallback — return index.html for any path not found on disk.
    # This lets React Router handle /logs/:id, /tunnels/:id, etc.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
